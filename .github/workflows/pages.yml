name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v4
      - name: Prepare site
        shell: bash
        run: |
          mkdir -p _site/css _site/data _site/js
          cp index.html Controle_Licencas_Solinftec.html _site/
          cp css/styles.css _site/css/
          cp data/licencas.js data/fluxo.js data/licencas_planilha.js data/supabase-config.js _site/data/
          cp js/app.js js/data-service.js _site/js/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4